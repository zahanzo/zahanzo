name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVG de Estatísticas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zahanzo
          
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo
          theme: tokyonight
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook, tex, less
          plugin_languages_details: percentage
          plugin_languages_limit: 5